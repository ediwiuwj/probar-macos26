name: Informe pantalla macOS 26

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  informe:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Recopilar datos
        run: |
          mkdir -p /tmp/rep
          R=/tmp/rep/REPORT.txt
          exec > >(tee "$R") 2>&1
          ANKA="/Library/Application Support/Veertu/Anka"
          echo "################ 1. ADDOONS DE ANKA ################"
          ls -la "$ANKA/addons" "$ANKA/bin" 2>&1 | head -40
          echo
          echo "=== kcpassword ==="
          file "$ANKA/addons/kcpassword" 2>&1
          head -60 "$ANKA/addons/kcpassword" 2>&1
          echo
          echo "=== change_res ==="
          head -40 "$ANKA/addons/change_res" 2>&1
          echo
          echo "=== bin/click ==="
          head -30 "$ANKA/bin/click" 2>&1
          echo
          echo "=== como se invoca kcpassword (procesos/servicios) ==="
          ps ax -o pid,command | grep -iE "kcpassword|addonsd" | grep -v grep || echo "ninguno"
          echo
          echo "################ 2. USAR kcpassword PARA FIJAR LA PASSWORD ################"
          echo "--- intentos con distintos argumentos ---"
          for arg in "macos26" "-u runner macos26" "runner macos26" "--user runner --password macos26"; do
            echo ">>> kcpassword $arg"
            sudo "$ANKA/addons/kcpassword" $arg 2>&1 | head -5 || true
            sudo dscl . -authonly runner macos26 >/dev/null 2>&1 && { echo "   >>> PASSWORD macos26 AHORA CORRECTA"; break; } || echo "   (aun incorrecta)"
          done
          echo "--- otros comandos posibles de kcpassword ---"
          sudo "$ANKA/addons/kcpassword" --help 2>&1 | head -15 || true
          sudo "$ANKA/addons/kcpassword" -h 2>&1 | head -15 || true
          echo
          echo "################ 3. ESTADO DE PASSWORD ################"
          sudo dscl . -authonly runner macos26 2>&1 && echo "PASSWORD macos26: CORRECTA" || echo "PASSWORD macos26: INCORRECTA"
          echo
          echo "################ 4. PROBAR ARD (sin legacy) CON LA PASSWORD ################"
          KS=/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart
          sudo "$KS" -activate -configure -access -on -users runner -privs -all -restart -agent 2>&1 | tail -6
          sleep 8
          echo "--- security types offered (sin legacy) ---"
          python3 - <<'PYEOF' 2>&1
          import socket
          s = socket.create_connection(('127.0.0.1', 5900), timeout=10)
          s.recv(12); s.sendall(b'RFB 003.008\n')
          n = s.recv(1)[0]
          print("types:", list(s.recv(n)))
          s.close()
          PYEOF
          echo
          echo "################ 5. FIN ################"

      - name: Publicar informe
        run: |
          git fetch origin main 2>&1 | tail -1 || true
          git checkout -B main origin/main 2>/dev/null || git checkout -B main
          git config user.email "bot@users.noreply.github.com"
          git config user.name "bot"
          cp /tmp/rep/REPORT.txt ./REPORT.txt
          wc -l REPORT.txt
          git add -f REPORT.txt
          git commit -q -m "REPORT" || true
          PUSH="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$PUSH" main > /tmp/push.log 2>&1 || {
            git pull --rebase origin main 2>&1 | tail -2
            cp /tmp/rep/REPORT.txt ./REPORT.txt
            git add -f REPORT.txt
            git commit -q -m "REPORT" || true
            git push "$PUSH" main > /tmp/push2.log 2>&1 || true
            cat /tmp/push2.log
          }
          cat /tmp/push.log
