name: Informe pantalla macOS 26

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  informe:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Recopilar datos
        run: |
          mkdir -p /tmp/rep
          R=/tmp/rep/REPORT.txt
          exec > >(tee "$R") 2>&1
          echo "################ 1. BUSCAR LA PASSWORD DE LA CUENTA ################"
          echo "--- keychain System: com.apple.loginwindow ---"
          sudo security find-generic-password -a runner -s com.apple.loginwindow -w /Library/Keychains/System.keychain 2>&1 || true
          echo "--- keychain login del usuario ---"
          sudo security find-generic-password -a runner -s com.apple.loginwindow -w "/Users/runner/Library/Keychains/login.keychain-db" 2>&1 || true
          echo "--- cualquier generic-password de runner en System.keychain ---"
          sudo security dump-keychain /Library/Keychains/System.keychain 2>/dev/null | grep -iE "loginwindow|runner" | head -20 || echo "sin coincidencias"
          echo "--- lista de entradas del keychain de sistema (servicios) ---"
          sudo security dump-keychain /Library/Keychains/System.keychain 2>/dev/null | grep -E "^\s+\"svce\"" | sort -u | head -30 || true
          echo
          echo "--- dscl: borrar _writers_passwd y reintentar ---"
          sudo dscl . -delete /Users/runner dsAttrTypeNative:_writers_passwd 2>&1 || true
          sudo dscl . -passwd /Users/runner macos26 2>&1 | head -3 || true
          echo "--- verificar ---"
          sudo dscl . -authonly runner macos26 2>&1 && echo "PASSWORD macos26: CORRECTA" || echo "PASSWORD macos26: INCORRECTA"
          echo
          echo "--- dscl: pasar old vacio + nuevo ---"
          sudo dscl . -passwd /Users/runner "" macos26 2>&1 | head -3 || true
          sudo dscl . -authonly runner macos26 2>&1 && echo "PASSWORD macos26: CORRECTA" || echo "PASSWORD macos26: INCORRECTA"
          echo
          echo "--- volcado completo del registro runner (buscando pistas) ---"
          sudo dscl . -read /Users/runner 2>&1 | head -40
          echo
          echo "--- kcpassword / autoLogin en prefs ---"
          sudo defaults read /Library/Preferences/com.apple.loginwindow 2>&1 | head -25
          echo
          echo "--- variables de entorno / ficheros de provision con PASSWORD ---"
          sudo grep -rIl --exclude-dir=Library -e "vm_password" -e "USER_PASSWORD" /Users/runner /Library/Application\ Support/Veertu 2>/dev/null | head -10 || true
          sudo find /Library/Application\ Support/Veertu -maxdepth 3 -type f 2>/dev/null | head -20 || true
          echo
          echo "################ 2. ESTADO DE PANTALLAS ################"
          system_profiler SPDisplaysDataType 2>&1 | head -40
          echo "--- CoreGraphics displays via python ---"
          cat > /tmp/dpy.py <<'PYEOF'
          try:
              from Quartz import CGGetActiveDisplayList, CGDisplayPixelsWide, CGDisplayPixelsHigh, CGDisplayBounds
              n, ids = CGGetActiveDisplayList(16, None)
              arr = [0]*n
              from Quartz import CGGetActiveDisplayList as G
              err, ids = G(16, arr)
              for i, d in enumerate(arr[:err]):
                  print(f"display {i}: id={d} {CGDisplayPixelsWide(d)}x{CGDisplayPixelsHigh(d)} bounds={CGDisplayBounds(d)}")
              if err == 0:
                  print("sin displays activos")
          except Exception as e:
              print("Quartz no disponible:", e)
          PYEOF
          python3 /tmp/dpy.py 2>&1 || true
          echo
          echo "################ 3. VNC LEGACY + SONDA ################"
          KS=/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart
          sudo "$KS" -activate -configure -access -on -users runner -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw macos26 \
            -restart -agent 2>&1 | tail -8
          sleep 8
          python3 tools/vncprobe.py macos26 2>&1 || true
          echo
          echo "################ 4. FIN ################"

      - name: Publicar informe
        run: |
          git fetch origin main 2>&1 | tail -1 || true
          git checkout -B main origin/main 2>/dev/null || git checkout -B main
          git config user.email "bot@users.noreply.github.com"
          git config user.name "bot"
          cp /tmp/rep/REPORT.txt ./REPORT.txt
          wc -l REPORT.txt
          git add -f REPORT.txt
          git commit -q -m "REPORT" || true
          PUSH="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$PUSH" main > /tmp/push.log 2>&1 || {
            echo "push fallo, reintento con rebase"
            git pull --rebase origin main 2>&1 | tail -2
            cp /tmp/rep/REPORT.txt ./REPORT.txt
            git add -f REPORT.txt
            git commit -q -m "REPORT" || true
            git push "$PUSH" main > /tmp/push2.log 2>&1 || true
            cat /tmp/push2.log
          }
          cat /tmp/push.log
