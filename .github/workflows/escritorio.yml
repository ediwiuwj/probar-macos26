name: Escritorio web macOS 26

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  escritorio:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Diagnostico rapido de Anka (shortcut VNC)
        run: |
          ANKA="/Library/Application Support/Veertu/Anka"
          echo "=== strings de kcpassword (protocolo/uso) ==="
          strings "$ANKA/addons/kcpassword" 2>/dev/null | grep -iE "usage|password|socket|anka|user|set" | head -30 || true
          echo "=== sockets ==="
          ls -la /var/run/anka 2>&1 | head
          echo "=== cliclick instalado? ==="
          which cliclick || brew list cliclick 2>/dev/null || echo "no instalado"

      - name: Instalar cliclick
        run: |
          if ! which cliclick >/dev/null 2>&1; then
            brew install cliclick 2>&1 | tail -5 || true
          fi
          which cliclick || ls -la /opt/homebrew/bin/cliclick 2>&1 || echo "cliclick NO disponible"
          echo "--- probando cliclick ---"
          /bin/bash -c "cliclick p" 2>&1 | head -3 || true

      - name: Permisos TCC para capture/accesibilidad
        run: |
          DB="/Library/Application Support/com.apple.TCC/TCC.db"
          CANDS="$(which python3 2>/dev/null) /opt/homebrew/bin/python3 /opt/homebrew/bin/cliclick /usr/bin/python3 /bin/bash /usr/bin/osascript /usr/sbin/screencapture"
          for c in $CANDS; do
            [ -z "$c" ] && continue
            for svc in kTCCServiceScreenCapture kTCCServiceAccessibility; do
              sudo sqlite3 "$DB" "INSERT OR IGNORE INTO access (service, client, client_type, auth_value, auth_reason, indirect_object_identifier, indirect_object_identifier_type, flags, last_modified) SELECT '$svc', '$c', client_type, auth_value, auth_reason, indirect_object_identifier, indirect_object_identifier_type, flags, strftime('%s','now') FROM access WHERE service='$svc' AND client IN ('/bin/bash','/opt/hca/hosted-compute-agent') LIMIT 1;" 2>&1
              sudo sqlite3 "$DB" "INSERT OR IGNORE INTO access (service, client, client_type, auth_value, auth_reason, indirect_object_identifier, indirect_object_identifier_type, flags, last_modified) SELECT '$svc', '$c', 1, 2, 4, NULL, NULL, 0, strftime('%s','now') WHERE NOT EXISTS (SELECT 1 FROM access WHERE service='$svc' AND client='$c');" 2>&1
            done
          done
          sudo sqlite3 "$DB" "SELECT service, client, auth_value FROM access WHERE service IN ('kTCCServiceScreenCapture','kTCCServiceAccessibility') AND client LIKE '%homebrew%' OR client='/bin/bash';" 2>&1 | head -20
          sudo launchctl kickstart -k system/com.apple.tccd 2>/dev/null || true
          sleep 4

      - name: Probar captura de pantalla
        run: |
          /bin/bash -c "/usr/sbin/screencapture -x -t jpg /tmp/t.jpg" 2>&1 || true
          ls -la /tmp/t.jpg 2>&1 || echo "sin captura"
          /bin/bash -c "/usr/bin/sips -g pixelWidth -g pixelHeight /tmp/t.jpg" 2>&1 | tail -3

      - name: Preparar el escritorio (wallpaper visible + ventanas)
        run: |
          echo "=== resolucion real del escritorio (bounds) ==="
          /bin/bash -c "osascript -e 'tell application \"Finder\" to get bounds of window of desktop'" 2>&1 | head -3
          /bin/bash -c "/usr/sbin/screencapture -x -t jpg /tmp/b.jpg" 2>&1 || true
          /bin/bash -c "/usr/bin/sips -g pixelWidth -g pixelHeight /tmp/b.jpg" 2>&1 | tail -2
          echo "=== wallpapers disponibles ==="
          ls /System/Library/Desktop\ Pictures/ 2>&1 | head -12
          echo "=== poner wallpaper visible ==="
          for p in "/System/Library/Desktop Pictures/Sonoma Graphite.heic" \
                   "/System/Library/Desktop Pictures/Basic.heic" \
                   "/System/Library/Desktop Pictures/Default.heic" \
                   "/Library/Desktop Pictures/Sonoma Graphite.heic" \
                   "/System/Library/Desktop Pictures/Abstract.heic"; do
            [ -f "$p" ] || continue
            if /bin/bash -c "osascript -e 'tell application \"Finder\" to set desktop picture to POSIX file \"$p\"'" >/dev/null 2>&1; then
              echo "wallpaper puesto: $p"; break
            fi
          done
          echo
          echo "=== abrir Terminal con contenido ==="
          /bin/bash -c 'osascript -e "tell application \"Terminal\" to do script \"sw_vers; uname -a; echo ESCORITORIO-ACTIVO\"" -e "tell application \"Terminal\" to activate"' 2>&1 | head -3 || true
          sleep 5
          /bin/bash -c 'osascript -e "tell application \"Terminal\" to set bounds of front window to {40, 60, 900, 620}"' 2>&1 | head -2 || true
          /bin/bash -c 'open -a "TextEdit"' 2>&1 | head -2 || true
          sleep 4
          echo "=== apps abiertas ==="
          ps ax -o command | grep -iE "Terminal.app|TextEdit" | grep -v grep | head -5 || echo "ninguna"
          echo
          echo "=== verificacion: contenido en el CENTRO de la pantalla ==="
          /bin/bash -c "/usr/sbin/screencapture -x -t jpg /tmp/check.jpg" 2>&1 || true
          ls -la /tmp/check.jpg 2>&1 || echo "sin captura"
          /usr/bin/sips -g pixelWidth -g pixelHeight /tmp/check.jpg 2>&1 | tail -2
          python3 -m venv /tmp/vp >/dev/null 2>&1 || true
          /tmp/vp/bin/pip install -q pillow 2>&1 | tail -1 || true
          /tmp/vp/bin/python - <<'PYEOF' 2>&1 || true
          from PIL import Image
          im = Image.open('/tmp/check.jpg').convert('L')
          W,H = im.size
          px = im.load()
          def band(y0,y1,label):
              vals=[px[x,y] for y in range(y0,min(y1,H),2) for x in range(0,W,4)]
              print(f"  {label:26} media={sum(vals)/len(vals):6.1f}  no_nulos={100*sum(1 for v in vals if v)/len(vals):5.1f}%")
          band(0,int(H*0.06),"menu")
          band(int(H*0.06),int(H*0.80),"CENTRO")
          band(int(H*0.80),H,"inferior/dock")
          cols,rows=80,40
          small=im.resize((cols,rows)); chars=" .:-=+*#%@"; d=list(small.getdata())
          print("  --- ASCII ---")
          for y in range(rows):
              print("  |"+"".join(chars[min(9,v*10//256)] for v in d[y*cols:(y+1)*cols])+"|")
          PYEOF

      - name: Levantar noVNC nativo (VNC real) en paralelo + sonda
        run: |
          KS=/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart
          sudo "$KS" -activate -configure -access -on -users runner -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw macos26 \
            -restart -agent 2>&1 | tail -4
          sleep 6
          mkdir -p /tmp/novnc
          curl -fsSL --retry 3 -o /tmp/novnc.tar.gz https://github.com/novnc/noVNC/archive/refs/tags/v1.5.0.tar.gz
          tar -xzf /tmp/novnc.tar.gz -C /tmp/novnc --strip-components=1
          python3 - <<'PYEOF'
          p = '/tmp/novnc/core/rfb.js'
          s = open(p, encoding='utf-8').read()
          old = "const types = this._sock.rQshiftBytes(numTypes);"
          new = old + "\n            types.sort((a, b) => (a === 2 ? -1 : (b === 2 ? 1 : 0)));"
          if old in s and 'a === 2 ? -1' not in s:
              open(p, 'w', encoding='utf-8').write(s.replace(old, new, 1))
              print("PATCH OK")
          PYEOF
          python3 -m venv /tmp/vncenv >/dev/null 2>&1 || true
          /tmp/vncenv/bin/pip install -q websockify 2>&1 | tail -1 || true
          WS=$(/tmp/vncenv/bin/python -c "import websockify,os;print(os.path.dirname(websockify.__file__))" 2>/dev/null || echo "")
          echo "websockify: $WS"
          if [ -n "$WS" ]; then
            nohup /tmp/vncenv/bin/python "$WS/websocketproxy.py" --web /tmp/novnc 6080 localhost:5900 >/tmp/websockify.log 2>&1 &
            sleep 4
            cat /tmp/websockify.log
          fi
          echo "=== SONDA: contenido del framebuffer VNC (varias passwords) ==="
          python3 tools/vncprobe.py macos26 "macos26 " "" runner password tahoe macos admin vnc 12345678 87654321 123456 2>&1 | tail -60 || true

      - name: Levantar escritorio web + tunel
        run: |
          echo "=== venv con pyobjc (CoreGraphics nativo) ==="
          python3 -m venv /tmp/wd
          /tmp/wd/bin/pip install -q --upgrade pip 2>&1 | tail -1
          /tmp/wd/bin/pip install -q pyobjc-framework-Quartz 2>&1 | tail -3
          /tmp/wd/bin/python -c "import Quartz; print('pyobjc Quartz OK')" 2>&1 | tail -2
          echo "=== TCC para el python del venv ==="
          DB="/Library/Application Support/com.apple.TCC/TCC.db"
          for c in /tmp/wd/bin/python /tmp/wd/bin/python3; do
            [ -e "$c" ] || continue
            for svc in kTCCServiceScreenCapture kTCCServiceAccessibility; do
              sudo sqlite3 "$DB" "INSERT OR IGNORE INTO access (service, client, client_type, auth_value, auth_reason, indirect_object_identifier, indirect_object_identifier_type, flags, last_modified) SELECT '$svc', '$c', client_type, auth_value, auth_reason, indirect_object_identifier, indirect_object_identifier_type, flags, strftime('%s','now') FROM access WHERE service='$svc' AND client IN ('/bin/bash','/opt/hca/hosted-compute-agent') LIMIT 1;" 2>&1
              sudo sqlite3 "$DB" "INSERT OR IGNORE INTO access (service, client, client_type, auth_value, auth_reason, indirect_object_identifier, indirect_object_identifier_type, flags, last_modified) SELECT '$svc', '$c', 1, 2, 4, NULL, NULL, 0, strftime('%s','now') WHERE NOT EXISTS (SELECT 1 FROM access WHERE service='$svc' AND client='$c');" 2>&1
            done
          done
          sudo launchctl kickstart -k system/com.apple.tccd 2>/dev/null || true
          sleep 3
          nohup /bin/bash -c "FPS=30 /tmp/wd/bin/python tools/webdesktop.py" >/tmp/webdesktop.log 2>&1 &
          sleep 18
          echo "--- log webdesktop ---"; cat /tmp/webdesktop.log
          echo "--- test local ---"
          curl -s -o /dev/null -w "info -> HTTP %{http_code}\n" --max-time 10 http://127.0.0.1:6081/info || true
          curl -s --max-time 10 http://127.0.0.1:6081/info || true
          echo
          echo "--- fps real medido tras 10s ---"
          sleep 10
          curl -s --max-time 10 http://127.0.0.1:6081/info || true
          echo
          echo "--- test stream MJPEG (6s) ---"
          curl -s --max-time 6 -o /tmp/stream.bin -w "stream -> HTTP %{http_code} %{size_download} bytes\n" http://127.0.0.1:6081/stream.mjpeg || true
          grep -ac "Content-Type: image/jpeg" /tmp/stream.bin 2>/dev/null | head -1 | sed 's/^/frames en 6s: /'
          if [ ! -x /tmp/cloudflared ]; then
            curl -fsSL --retry 3 -o /tmp/cloudflared.tgz https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz
            tar -xzf /tmp/cloudflared.tgz -C /tmp cloudflared
            chmod +x /tmp/cloudflared
          fi
          nohup /tmp/cloudflared tunnel --url http://localhost:6081 >/tmp/cf.log 2>&1 &
          sleep 20
          URL=$(grep -oE "https://[a-zA-Z0-9.-]+\.trycloudflare\.com" /tmp/cf.log | head -1)
          echo "========== URL ESCRITORIO WEB (MJPEG) =========="
          echo "$URL"
          echo "=============================================="
          tail -3 /tmp/cf.log
          VNCURL=""
          if curl -s --max-time 3 -o /dev/null http://127.0.0.1:6080/vnc.html; then
            nohup /tmp/cloudflared tunnel --url http://localhost:6080 >/tmp/cf2.log 2>&1 &
            sleep 18
            VNCURL=$(grep -oE "https://[a-zA-Z0-9.-]+\.trycloudflare\.com" /tmp/cf2.log | head -1)
            echo "========== URL noVNC (VNC nativo) =========="
            echo "$VNCURL"
            echo "============================================"
          fi
          git fetch origin main 2>&1 | tail -1 || true
          git checkout -B main origin/main 2>/dev/null || git checkout -B main
          git config user.email "bot@users.noreply.github.com"
          git config user.name "bot"
          echo "$URL" > URL.txt
          echo "$VNCURL" > VNCURL.txt
          git add -f URL.txt VNCURL.txt
          git commit -q -m "URL escritorio web" || true
          PUSH="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$PUSH" main > /tmp/push.log 2>&1 || {
            git pull --rebase origin main 2>&1 | tail -2
            echo "$URL" > URL.txt
            echo "$VNCURL" > VNCURL.txt
            git add -f URL.txt VNCURL.txt
            git commit -q -m "URL escritorio web" || true
            git push "$PUSH" main > /tmp/push2.log 2>&1 || true
            cat /tmp/push2.log
          }
          cat /tmp/push.log

      - name: Mantener vivo
        run: |
          echo "Escritorio web activo."
          sleep 3600
