name: macOS 26 con noVNC (navegador)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  novnc:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Verificar sesion grafica
        run: |
          echo "usuario: $(whoami) / $(id -un)"
          screencapture -x /tmp/shot.png 2>&1 || true
          sips -g pixelWidth -g pixelHeight /tmp/shot.png 2>/dev/null || true

      - name: Fijar password del usuario runner (varios metodos)
        run: |
          echo "== metodo 1: dscl -passwd =="
          sudo dscl . -passwd /Users/runner macos26 2>&1 | head -3 || true
          echo "== metodo 2: passwd =="
          printf 'macos26\nmacos26\n' | sudo passwd runner 2>&1 | head -5 || true
          echo "== metodo 3: sysadminctl =="
          sudo sysadminctl -adminUser runner -newPassword macos26 2>&1 | head -5 || true
          echo "== verificacion (authonly) =="
          sudo dscl . -authonly runner macos26 2>&1 && echo "PASSWORD macos26: CORRECTA" || echo "PASSWORD macos26: INCORRECTA"

      - name: Activar VNC Legacy con password (sintaxis correcta)
        run: |
          KS=/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart
          sudo "$KS" -activate -configure -access -on -users runner -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw macos26 \
            -restart -agent 2>&1 | tail -20
          sleep 8
          echo "=== prefs ==="
          sudo defaults read /Library/Preferences/com.apple.RemoteManagement 2>/dev/null | grep -iE "vnc|password" || true
          echo "=== puerto 5900 ==="
          (nc -z 127.0.0.1 5900 && echo "puerto 5900 ABIERTO") || echo "puerto 5900 cerrado"

      - name: Handshake RFB (metodos de auth ofrecidos)
        run: |
          cat > /tmp/rfb.py <<'PYEOF'
          import socket
          s = socket.create_connection(('127.0.0.1', 5900), timeout=10)
          print("version:", s.recv(12))
          s.sendall(b'RFB 003.008\n')
          n = s.recv(1)
          if not n:
              print("sin security types"); raise SystemExit
          n = n[0]
          types = list(s.recv(n))
          names = {1:'None',2:'VNC Auth clasico (solo password)',16:'Tight',19:'VeNCrypt',30:'Apple/ARD (user+pass)',33:'Apple ext',35:'Apple ext',36:'Apple ext'}
          print("security types:", [(t, names.get(t,'?')) for t in types])
          print("VNC CLASICO DISPONIBLE:" , "SI" if 2 in types else "NO")
          s.close()
          PYEOF
          python3 /tmp/rfb.py 2>&1 || echo "handshake fallo"

      - name: Instalar noVNC + websockify + cloudflared
        run: |
          mkdir -p /tmp/novnc
          curl -fsSL --retry 3 -o /tmp/novnc.tar.gz https://github.com/novnc/noVNC/archive/refs/tags/v1.5.0.tar.gz
          tar -xzf /tmp/novnc.tar.gz -C /tmp/novnc --strip-components=1
          echo "noVNC OK: $(ls /tmp/novnc/vnc.html >/dev/null 2>&1 && echo si || echo no)"
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q websockify 2>&1 | tail -2
          WS=$(/tmp/venv/bin/python -c "import websockify,os;print(os.path.dirname(websockify.__file__))")
          echo "$WS" > /tmp/ws_path
          curl -fsSL --retry 3 -o /tmp/cloudflared.tgz https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz
          tar -xzf /tmp/cloudflared.tgz -C /tmp cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared --version 2>&1 | head -1

      - name: Levantar noVNC + tunel Cloudflare
        run: |
          WS=$(cat /tmp/ws_path)
          nohup /tmp/venv/bin/python "$WS/websocketproxy.py" --web /tmp/novnc 6080 localhost:5900 >/tmp/websockify.log 2>&1 &
          sleep 4
          nohup /tmp/cloudflared tunnel --url http://localhost:6080 >/tmp/cf.log 2>&1 &
          sleep 18
          URL=$(grep -oE "https://[a-zA-Z0-9.-]+\.trycloudflare\.com" /tmp/cf.log | head -1)
          echo "========== URL noVNC =========="
          echo "$URL"
          echo "================================"
          echo "--- websockify.log ---"; cat /tmp/websockify.log
          git checkout -B main origin/main 2>/dev/null || git checkout -B main
          git config user.email "novnc-bot@users.noreply.github.com"
          git config user.name "novnc-bot"
          echo "$URL" > URL.txt
          git add URL.txt
          git commit -q -m "URL noVNC" || true
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main 2>&1 | tail -2 || true

      - name: Mantener vivo
        run: |
          echo "Tunel activo. Si pide password: macos26. Si pide usuario: runner."
          sleep 3600
