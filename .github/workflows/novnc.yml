name: macOS 26 con noVNC (navegador)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  novnc:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Verificar sesion grafica
        run: |
          echo "usuario: $(whoami) / $(id -un)"
          screencapture -x /tmp/shot.png 2>&1 || true
          ls -la /tmp/shot.png 2>/dev/null || echo "sin captura"
          sips -g pixelWidth -g pixelHeight /tmp/shot.png 2>/dev/null || true

      - name: Fijar credenciales de login (usuario runner)
        run: |
          sudo dscl . -passwd /Users/runner macos26 2>&1 || echo "dscl fallo"
          sudo defaults write /Library/Preferences/com.apple.loginwindow autoLoginUser -string runner 2>/dev/null || true
          sudo defaults write /Library/Preferences/com.apple.loginwindow autoLoginUserScreenLocked -bool false 2>/dev/null || true
          echo "LOGIN -> usuario: runner / contrasena: macos26"

      - name: Habilitar Screen Sharing (VNC)
        run: |
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -users runner -privs -all \
            -clientopts -setvncpw -vncpw macos26 \
            -restart -agent 2>&1 || true
          sleep 6
          sudo launchctl list 2>/dev/null | grep -i screensharing || echo "screensharing no aparece en launchctl"
          (nc -z 127.0.0.1 5900 && echo "puerto 5900 ABIERTO") || echo "puerto 5900 cerrado"

      - name: Instalar noVNC + websockify + cloudflared
        run: |
          mkdir -p /tmp/novnc
          curl -fsSL --retry 3 -o /tmp/novnc.tar.gz https://github.com/novnc/noVNC/archive/refs/tags/v1.5.0.tar.gz
          tar -xzf /tmp/novnc.tar.gz -C /tmp/novnc --strip-components=1
          echo "noVNC OK: $(ls /tmp/novnc/vnc.html >/dev/null 2>&1 && echo si || echo no)"
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q websockify 2>&1 | tail -3
          WS=$(/tmp/venv/bin/python -c "import websockify,os;print(os.path.dirname(websockify.__file__))")
          echo "websockify: $WS"
          echo "$WS" > /tmp/ws_path
          curl -fsSL --retry 3 -o /tmp/cloudflared.tgz https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz
          tar -xzf /tmp/cloudflared.tgz -C /tmp cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared --version 2>&1 | head -2

      - name: Levantar noVNC + tunel Cloudflare
        run: |
          WS=$(cat /tmp/ws_path)
          nohup /tmp/venv/bin/python "$WS/websocketproxy.py" --web /tmp/novnc 6080 localhost:5900 >/tmp/websockify.log 2>&1 &
          sleep 4
          nohup /tmp/cloudflared tunnel --url http://localhost:6080 >/tmp/cf.log 2>&1 &
          sleep 18
          URL=$(grep -oE "https://[a-zA-Z0-9.-]+\.trycloudflare\.com" /tmp/cf.log | head -1)
          echo "========== URL noVNC =========="
          echo "$URL"
          echo "================================"
          echo "--- websockify.log ---"; cat /tmp/websockify.log
          echo "--- cf.log (fin) ---"; tail -6 /tmp/cf.log
          git checkout -B main origin/main 2>/dev/null || git checkout -B main
          git config user.email "novnc-bot@users.noreply.github.com"
          git config user.name "novnc-bot"
          echo "$URL" > URL.txt
          git add URL.txt
          git commit -q -m "URL noVNC" || true
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main 2>&1 | tail -3 || true

      - name: Mantener vivo (conectate desde el navegador)
        run: |
          echo "Tunel activo. Login macOS -> usuario: runner / contrasena: macos26"
          sleep 3600
