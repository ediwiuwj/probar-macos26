name: macOS 26 con noVNC (navegador)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  novnc:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Verificar sesion grafica
        run: |
          echo "usuario: $(whoami) / $(id -un)"
          screencapture -x /tmp/shot.png 2>&1 || true
          sips -g pixelWidth -g pixelHeight /tmp/shot.png 2>/dev/null || true

      - name: Activar VNC Legacy con password conocida
        run: |
          KS=/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart
          sudo "$KS" -activate -configure -access -on -users runner -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw macos26 \
            -restart -agent 2>&1 | tail -15
          sleep 8
          echo "=== VNCLegacyConnectionsEnabled ==="
          sudo defaults read /Library/Preferences/com.apple.RemoteManagement VNCLegacyConnectionsEnabled 2>&1
          echo "=== donde vive el password VNC ==="
          sudo plutil -p /Library/Preferences/com.apple.RemoteManagement.plist 2>&1 | head -20
          sudo plutil -p /var/root/Library/Preferences/com.apple.RemoteManagement.plist 2>&1 | head -20
          echo "=== busqueda ==="
          sudo find /Library/Preferences /var/root /private/var/db -iname "*RemoteManagement*" 2>/dev/null | head -10
          echo "=== puerto 5900 ==="
          (nc -z 127.0.0.1 5900 && echo "puerto 5900 ABIERTO") || echo "puerto 5900 cerrado"

      - name: Test local de auth VNC con password macos26
        run: |
          cat > /tmp/vnctest.py <<'PYEOF'
          import socket, struct, subprocess, shutil, os, sys

          def find_openssl():
              for c in ["openssl"]:
                  p = shutil.which(c)
                  if p: return p
              for c in ["/opt/homebrew/opt/openssl@3/bin/openssl", "/opt/homebrew/bin/openssl", "/usr/local/opt/openssl@3/bin/openssl"]:
                  if os.path.exists(c): return c
              return None

          def des_ecb(key_hex, data):
              oss = find_openssl()
              if not oss: return None, "sin openssl"
              open('/tmp/_k.bin','wb').write(data)
              cmd = [oss, 'enc', '-des-ecb', '-nopad', '-K', key_hex]
              # openssl 3 requiere el provider legacy para DES
              cmd += ['-provider', 'legacy', '-provider', 'default']
              r = subprocess.run(cmd + ['-in','/tmp/_k.bin','-out','/tmp/_o.bin'],
                                 capture_output=True)
              if r.returncode != 0 and not os.path.exists('/tmp/_o.bin'):
                  r2 = subprocess.run([oss,'enc','-des-ecb','-nopad','-K',key_hex,'-in','/tmp/_k.bin','-out','/tmp/_o.bin'],
                                      capture_output=True)
                  if r2.returncode != 0:
                      return None, "openssl fallo: " + r2.stderr.decode()[:200]
              return open('/tmp/_o.bin','rb').read(), "ok"

          def test(pw):
              key = pw.encode()[:8].ljust(8, b'\0')
              key_hex = key.hex()
              s = socket.create_connection(('127.0.0.1', 5900), timeout=10)
              s.recv(12)
              s.sendall(b'RFB 003.008\n')
              n = s.recv(1)[0]
              types = list(s.recv(n))
              print("  security types:", types)
              if 2 not in types:
                  s.close(); return "NO_OFRECE_VNC_CLASICO"
              s.sendall(bytes([2]))
              chal = s.recv(16)
              resp, err = des_ecb(key_hex, chal)
              if resp is None:
                  s.close(); return "NO_PUEDO_CIFRAR: " + err
              s.sendall(resp)
              res = s.recv(4)
              status = struct.unpack('>I', res)[0]
              reason = ""
              if status != 0:
                  try:
                      ln = struct.unpack('>I', s.recv(4))[0]
                      reason = s.recv(ln).decode('utf-8','replace')
                  except Exception:
                      reason = "(sin reason)"
              s.close()
              return "OK" if status == 0 else ("RECHAZADO: " + reason)

          for pw in sys.argv[1:]:
              print(f"  password '{pw}' -> {test(pw)}")
          PYEOF
          python3 /tmp/vnctest.py macos26 runner password macos tahoe admin 2>&1

      - name: Instalar noVNC y PARCHEAR para preferir VNC clasico (tipo 2)
        run: |
          mkdir -p /tmp/novnc
          curl -fsSL --retry 3 -o /tmp/novnc.tar.gz https://github.com/novnc/noVNC/archive/refs/tags/v1.5.0.tar.gz
          tar -xzf /tmp/novnc.tar.gz -C /tmp/novnc --strip-components=1
          python3 - <<'PYEOF'
          p = '/tmp/novnc/core/rfb.js'
          s = open(p, encoding='utf-8').read()
          old = "const types = this._sock.rQshiftBytes(numTypes);"
          new = old + "\n            types.sort((a, b) => (a === 2 ? -1 : (b === 2 ? 1 : 0)));"
          if old in s and 'a === 2 ? -1' not in s:
              s = s.replace(old, new, 1)
              open(p, 'w', encoding='utf-8').write(s)
              print("PATCH OK: ahora noVNC prefiere el security type 2 (VNC clasico)")
          else:
              print("PATCH: ya aplicado o patron no encontrado")
          PYEOF
          grep -n "a === 2 ? -1" /tmp/novnc/core/rfb.js | head -3
          echo "noVNC OK: $(ls /tmp/novnc/vnc.html >/dev/null 2>&1 && echo si || echo no)"

      - name: Instalar websockify + cloudflared
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q websockify 2>&1 | tail -2
          WS=$(/tmp/venv/bin/python -c "import websockify,os;print(os.path.dirname(websockify.__file__))")
          echo "$WS" > /tmp/ws_path
          curl -fsSL --retry 3 -o /tmp/cloudflared.tgz https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz
          tar -xzf /tmp/cloudflared.tgz -C /tmp cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared --version 2>&1 | head -1

      - name: Levantar noVNC + tunel Cloudflare
        run: |
          WS=$(cat /tmp/ws_path)
          nohup /tmp/venv/bin/python "$WS/websocketproxy.py" --web /tmp/novnc 6080 localhost:5900 >/tmp/websockify.log 2>&1 &
          sleep 4
          nohup /tmp/cloudflared tunnel --url http://localhost:6080 >/tmp/cf.log 2>&1 &
          sleep 18
          URL=$(grep -oE "https://[a-zA-Z0-9.-]+\.trycloudflare\.com" /tmp/cf.log | head -1)
          echo "========== URL noVNC =========="
          echo "$URL"
          echo "================================"
          echo "--- websockify.log ---"; cat /tmp/websockify.log
          git checkout -B main origin/main 2>/dev/null || git checkout -B main
          git config user.email "novnc-bot@users.noreply.github.com"
          git config user.name "novnc-bot"
          echo "$URL" > URL.txt
          git add URL.txt
          git commit -q -m "URL noVNC" || true
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main 2>&1 | tail -2 || true

      - name: Mantener vivo
        run: |
          echo "Tunel activo. Password VNC: macos26"
          sleep 3600
