name: macOS 26 con noVNC (navegador)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  novnc:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Diagnostico de pantalla
        run: |
          echo "=== capturas: hay contenido en la consola? ==="
          screencapture -x /tmp/shot.png 2>&1 || true
          ls -la /tmp/shot.png 2>/dev/null || echo "sin captura"
          sips -g pixelWidth -g pixelHeight /tmp/shot.png 2>/dev/null || true
          echo
          echo "=== procesos de screen sharing / ARD ==="
          ps ax -o pid,command | grep -iE "screensharing|ARDAgent|RemoteManagement" | grep -v grep || echo "ninguno"
          echo
          echo "=== binarios candidatos ==="
          ls -la /usr/libexec/screensharingd /usr/sbin/screensharingd /usr/libexec/ScreensharingAgent 2>/dev/null || true
          find /System/Library/CoreServices/RemoteManagement -maxdepth 3 -name "ARDAgent" 2>/dev/null || true
          find /System/Library/PrivateFrameworks/ScreenSharing.framework -maxdepth 4 -type f -perm +111 2>/dev/null | head -8 || true

      - name: Conceder permisos TCC de captura de pantalla
        run: |
          DB="/Library/Application Support/com.apple.TCC/TCC.db"
          echo "=== esquema ==="
          sudo sqlite3 "$DB" ".schema access" | head -3
          echo "=== entradas actuales kTCCServiceScreenCapture ==="
          sudo sqlite3 "$DB" "SELECT client, client_type, auth_value FROM access WHERE service='kTCCServiceScreenCapture';" 2>&1
          echo
          CANDS=$( { ls /usr/libexec/screensharingd /usr/sbin/screensharingd /usr/libexec/ScreensharingAgent 2>/dev/null; \
                     find /System/Library/CoreServices/RemoteManagement -maxdepth 3 -name "ARDAgent" 2>/dev/null; \
                     find /System/Library/PrivateFrameworks/ScreenSharing.framework -maxdepth 4 -type f -perm +111 2>/dev/null; \
                     echo /usr/libexec/screensharingd; echo /usr/sbin/screensharingd; \
                     echo /System/Library/CoreServices/RemoteManagement/ARDAgent.app; } | sort -u )
          echo "=== granting a: ==="; echo "$CANDS"
          for c in $CANDS; do
            for svc in kTCCServiceScreenCapture kTCCServiceAccessibility; do
              sudo sqlite3 "$DB" "INSERT OR IGNORE INTO access (service, client, client_type, auth_value, auth_reason, indirect_object_identifier, indirect_object_identifier_type, flags, last_modified) SELECT '$svc', '$c', client_type, auth_value, auth_reason, indirect_object_identifier, indirect_object_identifier_type, flags, strftime('%s','now') FROM access WHERE service='$svc' AND client IN ('/bin/bash','/opt/hca/hosted-compute-agent','/usr/local/opt/runner/provisioner/provisioner') LIMIT 1;" 2>&1
              sudo sqlite3 "$DB" "INSERT OR IGNORE INTO access (service, client, client_type, auth_value, auth_reason, indirect_object_identifier, indirect_object_identifier_type, flags, last_modified) SELECT '$svc', '$c', 1, 2, 4, NULL, NULL, 0, strftime('%s','now') WHERE NOT EXISTS (SELECT 1 FROM access WHERE service='$svc' AND client='$c');" 2>&1
            done
          done
          echo "=== resultado ==="
          sudo sqlite3 "$DB" "SELECT service, client, client_type, auth_value FROM access WHERE service IN ('kTCCServiceScreenCapture','kTCCServiceAccessibility');" 2>&1
          echo
          echo "=== reiniciando daemons ==="
          sudo launchctl enable system/com.apple.screensharing 2>/dev/null || true
          sudo launchctl kickstart -k system/com.apple.tccd 2>/dev/null || true
          sudo launchctl kickstart -k system/com.apple.screensharing 2>/dev/null || true
          sudo killall -HUP tccd 2>/dev/null || true
          sleep 8
          (nc -z 127.0.0.1 5900 && echo "puerto 5900 ABIERTO") || echo "puerto 5900 cerrado"

      - name: Activar VNC Legacy con password conocida
        run: |
          KS=/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart
          sudo "$KS" -activate -configure -access -on -users runner -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw macos26 \
            -restart -agent 2>&1 | tail -12
          sleep 8
          sudo defaults read /Library/Preferences/com.apple.RemoteManagement VNCLegacyConnectionsEnabled 2>&1

      - name: Sonda VNC (mide si el framebuffer tiene contenido)
        run: |
          python3 tools/vncprobe.py macos26 2>&1 || true

      - name: Instalar noVNC + parche (preferir VNC clasico)
        run: |
          mkdir -p /tmp/novnc
          curl -fsSL --retry 3 -o /tmp/novnc.tar.gz https://github.com/novnc/noVNC/archive/refs/tags/v1.5.0.tar.gz
          tar -xzf /tmp/novnc.tar.gz -C /tmp/novnc --strip-components=1
          python3 - <<'PYEOF'
          p = '/tmp/novnc/core/rfb.js'
          s = open(p, encoding='utf-8').read()
          old = "const types = this._sock.rQshiftBytes(numTypes);"
          new = old + "\n            types.sort((a, b) => (a === 2 ? -1 : (b === 2 ? 1 : 0)));"
          if old in s and 'a === 2 ? -1' not in s:
              open(p, 'w', encoding='utf-8').write(s.replace(old, new, 1))
              print("PATCH OK")
          else:
              print("PATCH: ya aplicado o patron no encontrado")
          PYEOF
          grep -c "a === 2 ? -1" /tmp/novnc/core/rfb.js

      - name: Instalar websockify + cloudflared
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q websockify 2>&1 | tail -2
          WS=$(/tmp/venv/bin/python -c "import websockify,os;print(os.path.dirname(websockify.__file__))")
          echo "$WS" > /tmp/ws_path
          curl -fsSL --retry 3 -o /tmp/cloudflared.tgz https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz
          tar -xzf /tmp/cloudflared.tgz -C /tmp cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared --version 2>&1 | head -1

      - name: Levantar noVNC + tunel Cloudflare
        run: |
          WS=$(cat /tmp/ws_path)
          nohup /tmp/venv/bin/python "$WS/websocketproxy.py" --web /tmp/novnc 6080 localhost:5900 >/tmp/websockify.log 2>&1 &
          sleep 4
          nohup /tmp/cloudflared tunnel --url http://localhost:6080 >/tmp/cf.log 2>&1 &
          sleep 18
          URL=$(grep -oE "https://[a-zA-Z0-9.-]+\.trycloudflare\.com" /tmp/cf.log | head -1)
          echo "========== URL noVNC =========="
          echo "$URL"
          echo "================================"
          cat /tmp/websockify.log
          git fetch origin main 2>&1 | tail -1 || true
          git checkout -B main origin/main 2>/dev/null || git checkout -B main
          git config user.email "novnc-bot@users.noreply.github.com"
          git config user.name "novnc-bot"
          echo "$URL" > URL.txt
          git add -f URL.txt
          git commit -q -m "URL noVNC" || true
          PUSH="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$PUSH" main > /tmp/push.log 2>&1 || {
            git pull --rebase origin main 2>&1 | tail -2
            echo "$URL" > URL.txt
            git add -f URL.txt
            git commit -q -m "URL noVNC" || true
            git push "$PUSH" main > /tmp/push2.log 2>&1 || true
            cat /tmp/push2.log
          }
          cat /tmp/push.log

      - name: Mantener vivo
        run: |
          echo "Tunel activo. Password VNC: macos26"
          sleep 3600
